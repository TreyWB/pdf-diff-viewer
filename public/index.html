<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare the text in two PDF files side by side.">
  <title>PDF Diff Viewer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <section class="landing-page" id="landing-page">
      <div class="format-mark" aria-hidden="true">PDF</div>
      <h1>PDF Diff Viewer</h1>
      <p class="subtitle">Compare two PDF documents side by side</p>

      <div class="upload-section">
        <div class="file-inputs">
          <div class="file-input-wrapper" id="original-wrapper">
            <label for="original">Original PDF</label>
            <input type="file" id="original" accept="application/pdf,.pdf">
            <button class="file-button" type="button">
              <span class="file-icon" aria-hidden="true">−</span>
              <span class="file-action">Choose file</span>
            </button>
            <span class="file-name" id="original-name">No file selected</span>
          </div>
          <div class="file-input-wrapper" id="modified-wrapper">
            <label for="modified">Modified PDF</label>
            <input type="file" id="modified" accept="application/pdf,.pdf">
            <button class="file-button" type="button">
              <span class="file-icon" aria-hidden="true">+</span>
              <span class="file-action">Choose file</span>
            </button>
            <span class="file-name" id="modified-name">No file selected</span>
          </div>
        </div>
        <button id="compare" disabled>Compare PDFs</button>
        <p class="privacy-note">Processed locally by this app · files are never saved</p>
      </div>

      <div class="error-message" id="error" role="alert"></div>
    </section>

    <div class="loading" id="loading" aria-live="polite">
      <div class="spinner"></div>
      <span>Reading pages and comparing text...</span>
    </div>

    <header class="compare-header" id="compare-header">
      <div class="header-content">
        <div class="brand-lockup">
          <span class="mini-mark" aria-hidden="true">PDF</span>
          <h1>PDF Diff Viewer</h1>
        </div>
        <div class="comparison-summary">
          <span class="page-count" id="page-count">0 ↔ 0 pages</span>
          <div class="stats-section" id="stats">
            <span class="stat added"><span id="stat-added">0</span> added</span>
            <span class="stat removed"><span id="stat-removed">0</span> removed</span>
            <span class="stat modified"><span id="stat-modified">0</span> modified</span>
            <span class="stat unchanged"><span id="stat-unchanged">0</span> unchanged</span>
          </div>
        </div>
        <button id="reset">New Comparison</button>
      </div>
    </header>

    <main class="diff-container" id="diff-container">
      <section class="panel left-panel" aria-label="Original PDF">
        <div class="panel-header" id="left-header">Original</div>
        <div class="panel-content" id="left-content"></div>
      </section>
      <section class="panel right-panel" aria-label="Modified PDF">
        <div class="panel-header" id="right-header">Modified</div>
        <div class="panel-content" id="right-content"></div>
      </section>
    </main>
  </div>

  <script src="js/fileUpload.js"></script>
  <script src="js/diffRenderer.js"></script>
  <script src="js/scrollSync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
